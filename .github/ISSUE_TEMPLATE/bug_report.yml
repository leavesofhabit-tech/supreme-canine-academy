name: Bug report
description: Report a reproducible application or build problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Use invented dog names and synthetic profiles.
        Do not include real pet, owner, client, or veterinary records, passwords, tokens, or private keys.
        Report security vulnerabilities through the repository's private reporting link instead.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the app version, commit, or branch you tested.
      placeholder: 'For example: 0.2.6, a commit SHA, or main'
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Start and question search
        - Library filters and search
        - Answers and source reader
        - Dog profiles
        - Offline access or app updates
        - Installation, tests, or build
        - Accessibility or responsive layout
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal sequence using synthetic data. Include the exact question or public record ID when relevant.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Select ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a short sanitized error message or screenshot if useful.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Browser and environment
      description: Include browser/version, operating system, and viewport size; include Node.js/version for build issues.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This report uses synthetic examples and contains no private pet or person identifiers, credentials, or private records.
          required: true
